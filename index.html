<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบค้นหาร้านค้าวัสดุก่อสร้าง</title>
    <!-- โหลด Icon จาก FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- โหลดฟอนต์ภาษาไทย Sarabun -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2c3e50;
            --success: #27ae60;
            --danger: #e74c3c;
            --disabled: #bdc3c7;
            --bg: #f8f9fa;
        }
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: var(--bg);
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h2.province-title {
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
            padding-bottom: 10px;
            margin-top: 40px;
            font-size: 1.8em;
        }
        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .store-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid #eee;
        }
        .store-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }
        .store-name {
            font-size: 1.25em;
            font-weight: 700;
            margin: 0 0 5px 0;
            color: #2c3e50;
        }
        .district-badge {
            font-size: 0.75em;
            background-color: #e8f4f8;
            color: #2980b9;
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: 500;
            vertical-align: middle;
            margin-left: 5px;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 15px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-size: 0.95em;
            font-weight: 600;
            transition: opacity 0.2s, background-color 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn-call {
            background-color: var(--success);
        }
        .btn-call.disabled {
            background-color: var(--disabled);
            cursor: not-allowed;
            pointer-events: none;
        }
        .btn-map {
            background-color: var(--danger);
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- ข้อมูลร้านค้าจะถูกสร้างขึ้นที่นี่โดย JavaScript -->
    </div>

    <script>
        // 1. นำข้อมูล JSON ทั้งหมดของคุณมาใส่ไว้ในตัวแปรนี้
        const storeData = {
            "น่าน": [
                { "name": "ที พี ฮาร์ดแวร์", "phone": "089-852-2666", "address": "70/2 ม.2 ต.ท่าวังผา อ.ท่าวังผา จ.น่าน 55140", "gmap": "https://www.google.com/maps/search/?api=1&query=%E0%B8%97%E0%B8%B5%20%E0%B8%9E%E0%B8%B5%20%E0%B8%AE%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%94%E0%B9%81%E0%B8%A7%E0%B8%A3%E0%B9%8C%20%E0%B8%99%E0%B9%88%E0%B8%B2%E0%B8%99" },
                { "name": "วันทนา", "phone": "083-325-3121", "address": "188 ม.3 ต.ยอด อ.สองแคว", "gmap": "https://www.google.com/maps/search/?api=1&query=%E0%B8%A7%E0%B8%B1%E0%B8%99%E0%B8%97%E0%B8%99%E0%B8%B2" },
                { "name": "พีพี โฮมเพ้นท์", "phone": "094-635-5664", "address": "136 ม.10 ต.เชียงกลาง อ.เชียงกลาง จ.น่าน 55160", "gmap": "https://www.google.com/maps/search/?api=1&query=%E0%B8%9E%E0%B8%B5%E0%B8%9E%E0%B8%B5%20%E0%B9%82%E0%B8%AE%E0%B8%A1%E0%B9%80%E0%B8%9E%E0%B9%89%E0%B8%99%E0%B8%97%E0%B9%8C%20%E0%B8%99%E0%B9%88%E0%B8%B2%E0%B8%99" },
                { "name": "ปรีชาบริการ", "phone": "086-914-3140", "address": "109 ม.1 หมู่บ้าน ดู่ใต้ ต.ดู่ใต้ อ.เมืองน่าน 55000", "gmap": "https://www.google.com/maps/search/?api=1&query=%E0%B8%9B%E0%B8%A3%E0%B8%B5%E0%B8%8A%E0%B8%B2%E0%B8%9A%E0%B8%A3%E0%B8%B4%E0%B8%81%E0%B8%B2%E0%B8%A3%20%E0%B8%99%E0%B9%88%E0%B8%B2%E0%B8%99" },
                { "name": "เวียงสาวัสดุภัณฑ์", "phone": "083-956-9545", "address": "407/12 ม.3 ต.กลางเวียง อ.เวียงสา จ.น่าน 55110", "gmap": "https://www.google.com/maps/search/?api=1&query=%E0%B9%80%E0%B8%A7%E0%B8%B5%E0%B8%A2%E0%B8%87%E0%B8%AA%E0%B8%B2%E0%B8%A7%E0%B8%B1%E0%B8%AA%E0%B8%94%E0%B8%B8%E0%B8%A0%E0%B8%B1%E0%B8%93%E0%B8%91%E0%B9%8C%20%E0%B8%99%E0%B9%88%E0%B8%B2%E0%B8%99" }
            ],
            "พะเยา": [
                { "name": "แอนนี่", "phone": "091-842-0623", "address": "452 ม.5 ต.หย่วน อ.เชียงคำ จ.พะเยา 56110", "gmap": "https://www.google.com/maps/search/?api=1&query=%E0%B9%81%E0%B8%AD%E0%B8%99%E0%B8%99%E0%B8%B5%E0%B9%88%20%E0%B8%9E%E0%B8%B0%E0%B9%80%E0%B8%A2%E0%B8%B2" },
                { "name": "ชาลวิน", "phone": "", "address": "141 ม.10 ต.แม่ใจ อ.แม่ใจ จ.พะเยา 56130", "gmap": "https://www.google.com/maps/search/?api=1&query=%E0%B8%8A%E0%B8%B2%E0%B8%A5%E0%B8%A7%E0%B8%B4%E0%B8%99%20%E0%B8%9E%E0%B8%B0%E0%B9%80%E0%B8%A2%E0%B8%B2" }
            ],
            "ลำปาง": [
                { "name": "ชูพาณิชย์", "phone": "", "address": "65 ม.4 ต.หลวงเหนือ อ.งาว", "gmap": "https://www.google.com/maps/search/?api=1&query=%E0%B8%8A%E0%B8%B9%E0%B8%9E%E0%B8%B2%E0%B8%93%E0%B8%B4%E0%B8%8A%E0%B8%A2%E0%B9%8C" },
                { "name": "ดำวัสดุ", "phone": "098-980-5669", "address": "เลขที่10 ม.3 ต.ล้อมแรด อ.เถิน จ.ลำปาง 52160", "gmap": "https://www.google.com/maps/search/?api=1&query=%E0%B8%94%E0%B8%B3%E0%B8%A7%E0%B8%B1%E0%B8%AA%E0%B8%94%E0%B8%B8%20%E0%B8%A5%E0%B8%B3%E0%B8%9B%E0%B8%B2%E0%B8%87" }
            ],
            "ลำพูน": [
                { "name": "แม่เทยพาณิชย์", "phone": "082-035-6787", "address": "179 ม.13 ต.แม่ตืน อ.ลี้ จ.ลำพูน 51110", "gmap": "https://www.google.com/maps/search/?api=1&query=%E0%B9%81%E0%B8%A1%E0%B9%88%E0%B9%80%E0%B8%97%E0%B8%A2%E0%B8%9E%E0%B8%B2%E0%B8%93%E0%B8%B4%E0%B8%8A%E0%B8%A2%E0%B9%8C%20%E0%B8%A5%E0%B8%B3%E0%B8%9E%E0%B8%B9%E0%B8%99" }
            ],
            "เชียงใหม่": [
                { "name": "มาดี ชอป", "phone": "089-852-2439", "address": "99/2 ม.1 ต.แม่คือ อ.ดอยสะเก็ด จ.เชียงใหม่ 50220", "gmap": "https://www.google.com/maps/search/?api=1&query=%E0%B8%A1%E0%B8%B2%E0%B8%94%E0%B8%B5%20%E0%B8%8A%E0%B8%AD%E0%B8%9B%20%E0%B9%80%E0%B8%8A%E0%B8%B5%E0%B8%A2%E0%B8%87%E0%B9%83%E0%B8%AB%E0%B8%A1%E0%B9%88" },
                { "name": "ภัทรพลพานิช", "phone": "", "address": "178 ม.4 ต.ดอยเต่า อ.ดอยเต่า", "gmap": "https://www.google.com/maps/search/?api=1&query=%E0%B8%A0%E0%B8%B1%E0%B8%97%E0%B8%A3%E0%B8%9E%E0%B8%A5%E0%B8%9E%E0%B8%B2%E0%B8%99%E0%B8%B4%E0%B8%8A" }
            ]
            // หมายเหตุ: ตัดทอน JSON บางส่วนในตัวอย่างเพื่อความสั้นกระชับ 
            // ตอนนำไปใช้งานจริง คุณสามารถก๊อป JSON ของคุณทั้งหมดมาแทนที่โครงสร้างตรงนี้ได้เลยครับ
        };

        // 2. ฟังก์ชันสำหรับสกัดเฉพาะ "อ.xxxx" หรือ "เขตxxxx" จากที่อยู่เต็ม
        function extractDistrict(address) {
            if (!address) return '';
            // ค้นหาคำว่า อ. หรือ อำเภอ หรือ เขต ตามด้วยตัวอักษรที่ไม่ใช่ช่องว่างหรือคำว่า จ.
            const match = address.match(/(อ\.|อำเภอ|เขต)\s*([^\sจ]+)/);
            if (match) {
                // คืนค่ารูปแบบสั้นๆ เช่น "อ.ท่าวังผา"
                return match[1].replace('อำเภอ', 'อ.') + match[2]; 
            }
            return '';
        }

        // 3. เริ่มทำการ Render ข้อมูลลงจอ
        const app = document.getElementById('app');

        // วนลูปตามรายชื่อจังหวัด
        for (const [province, stores] of Object.entries(storeData)) {
            
            // สร้างหัวข้อชื่อจังหวัด
            const title = document.createElement('h2');
            title.className = 'province-title';
            title.innerHTML = `<i class="fas fa-map-marked-alt"></i> จังหวัด${province}`;
            app.appendChild(title);

            // สร้าง Grid สำหรับวางการ์ดร้านค้า
            const grid = document.createElement('div');
            grid.className = 'store-grid';

            // วนลูปสร้างการ์ดของแต่ละร้าน
            stores.forEach(store => {
                const card = document.createElement('div');
                card.className = 'store-card';

                // ดึงชื่ออำเภอ
                const districtStr = extractDistrict(store.address);
                const districtBadge = districtStr ? `<span class="district-badge">${districtStr}</span>` : '';

                // ตรวจสอบและสร้างปุ่มโทร
                let callButtonHTML = '';
                if (store.phone && store.phone.trim() !== '') {
                    // ตัดขีดออกเพื่อให้ใช้กับลิงก์ tel: ได้ชัวร์ๆ
                    const telLink = store.phone.replace(/[^0-9]/g, '');
                    callButtonHTML = `
                        <a href="tel:${telLink}" class="btn btn-call">
                            <i class="fas fa-phone-alt"></i> ${store.phone}
                        </a>
                    `;
                } else {
                    // กรณีไม่มีเบอร์โทร
                    callButtonHTML = `
                        <a href="javascript:void(0)" class="btn btn-call disabled">
                            <i class="fas fa-phone-slash"></i> ไม่มีเบอร์โทร
                        </a>
                    `;
                }

                // ประกอบ HTML สำหรับการ์ด 1 ใบ
                card.innerHTML = `
                    <h3 class="store-name">${store.name} ${districtBadge}</h3>
                    <div class="action-buttons">
                        ${callButtonHTML}
                        <a href="${store.gmap}" target="_blank" class="btn btn-map">
                            <i class="fas fa-map-marker-alt"></i> แผนที่
                        </a>
                    </div>
                `;
                
                grid.appendChild(card);
            });

            app.appendChild(grid);
        }
    </script>
</body>
</html>
